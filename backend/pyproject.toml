[project]
name = "backend"
version = "0.1.0"
description = "Backend server for build-it"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "supabase>=2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
